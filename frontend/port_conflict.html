<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; background: #22272e; color: #e2e8f0; padding: 20px; }
    button { background: #8aa8c4; color: #1c2128; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
    input[type=number] { padding: 8px; border-radius: 4px; border: 1px solid #373e47; background: #1c2128; color: #e2e8f0; margin-top: 10px; width: 100%; box-sizing: border-box; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h3>Port Conflict</h3>
  <p>Port <span id="port"></span> is already in use by another application.</p>
  <label style="display: flex; align-items: center; gap: 8px; margin-top: 15px; cursor: pointer;">
    <input type="checkbox" id="randomPort" checked style="width: 16px; height: 16px;"> Select random free port
  </label>
  <div id="manualPortDiv" class="hidden">
    <input type="number" id="manualPort" placeholder="Enter custom port (e.g. 8081)">
  </div>
  <div style="margin-top: 20px; text-align: right;">
    <button onclick="require('electron').ipcRenderer.send('port-conflict-result', { cancel: true })" style="background: transparent; color: #ef4444; border: 1px solid #ef4444;">Exit App</button>
    <button onclick="submit()">Continue</button>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('port').innerText = urlParams.get('port');

    document.getElementById('randomPort').addEventListener('change', (e) => {
      document.getElementById('manualPortDiv').className = e.target.checked ? 'hidden' : '';
    });

    function submit() {
      const random = document.getElementById('randomPort').checked;
      let port = 0;
      if (!random) {
        port = parseInt(document.getElementById('manualPort').value);
        if (!port || port < 1024 || port > 65535) {
          alert('Please enter a valid port number between 1024 and 65535');
          return;
        }
      }
      ipcRenderer.send('port-conflict-result', { cancel: false, random, port });
    }
  </script>
</body>
</html>
